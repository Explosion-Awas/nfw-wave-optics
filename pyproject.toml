[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfw-wave-optics"
version = "0.1.0"
description = "Direct single-image NFW wave-optics evaluation and saved paper evidence"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "GPT-6.1sol Max"}, {name = "Hermes"}]
dependencies = ["numpy>=2.0", "scipy>=1.11", "mpmath>=1.3", "sympy>=1.12"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/Explosion-Awas/nfw-wave-optics"
Paper = "https://explosion-awas.github.io/papers/nfw-wave-optics/"

[tool.setuptools]
packages = ["nfw_wave", "nfw_advanced", "nfw_frozen_cut"]

[tool.setuptools.package-dir]
nfw_wave = "src/nfw_wave"
nfw_advanced = "phase2/src/nfw_advanced"
nfw_frozen_cut = "phase2/frozen/cut_v1/nfw_frozen_cut"

[tool.pytest.ini_options]
pythonpath = ["src", "phase2/src", "phase2/frozen/cut_v1"]
testpaths = ["tests", "phase2/tests"]
addopts = "-ra"
